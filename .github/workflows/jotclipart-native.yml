name: JotClipart native release gates

on:
  push:
    branches: [main, 'migration/**']
  pull_request:
  workflow_dispatch:
    inputs:
      preview_origin:
        description: Owned JotClipart preview origin with the exact source revision
        required: false
        type: string
        default: https://preview.jotclipart.com

permissions:
  contents: read

concurrency:
  group: jotclipart-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'
  # Browser runners reject foreign origins before requests and pin the exact source and root.
  BASE_URL: ${{ inputs.preview_origin || 'https://preview.jotclipart.com' }}
  EXPECT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  native-source-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint preserved legacy and native workflow expressions with the pinned linter
        run: bash scripts/jotclipart/lint-workflows.sh
      - name: Verify changed code formatting against accepted native source
        run: node scripts/jotclipart/ci-native.mjs format
      - name: Source, signed social originals and all required native invariants
        run: node scripts/jotclipart/ci-native.mjs source
      - name: Clean independent Astro native software build
        run: pnpm build
      - name: Verify every exact package byte and actual platform limits
        run: node scripts/jotclipart/ci-native.mjs package
      - name: Verify the new repository has no old checkout, object-store or compiled-input dependency
        run: node scripts/jotclipart/verify-independent.mjs
      - name: Preserve bounded structured gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jotclipart-native-source-${{ github.sha }}
          path: reports/jotclipart-native-ci/
          retention-days: 3

  art:
    name: Preserved Python 3.12 source and PDF contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install the existing pinned art dependencies
        run: python -m pip install --disable-pip-version-check --requirement scripts/requirements-art.txt
      - name: Preserve all PDF, image, alpha and source-bound export checks
        run: python -m unittest discover -s tests -p 'test_*.py'

  preview-pin:
    needs: native-source-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait at most twenty minutes for the owner-deployed matching preview
        run: node scripts/jotclipart/ci-browser.mjs pin
      - uses: actions/upload-artifact@v4
        with:
          name: jotclipart-preview-pin-${{ github.sha }}
          path: reports/jotclipart-native-browser/preview-pin.json
          retention-days: 3

  native-browser:
    needs: preview-pin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        engine: [chromium, firefox, webkit]
        width: [320, 390, 768, 1440]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    env:
      UC_BROWSER: ${{ matrix.engine }}
      VIEWPORT_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: jotclipart-preview-pin-${{ github.sha }}
          path: reports/jotclipart-native-browser/
      - name: Verify real browser metadata readiness and preserve visible errors
        run: node tests/e2e/browser-readiness.mjs
      - name: Actual preview flows with old hosts blocked
        id: basic
        run: node scripts/jotclipart/ci-browser.mjs browser
      - name: All workbench commands, export formats, recovery and private portability
        if: ${{ !cancelled() && steps.basic.outcome != 'skipped' }}
        run: node scripts/jotclipart/feature-browser.mjs
      - name: Preserve reports and viewport evidence, without original download binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jotclipart-browser-${{ matrix.engine }}-${{ matrix.width }}-${{ github.sha }}
          path: |
            reports/jotclipart-native-browser/${{ matrix.engine }}-${{ matrix.width }}/*.json
            reports/jotclipart-native-browser/${{ matrix.engine }}-${{ matrix.width }}/*.png
          retention-days: 3

  native-release:
    if: always()
    needs: [native-source-and-package, art, preview-pin, native-browser]
    runs-on: ubuntu-latest
    steps:
      - name: All native gates are mandatory
        env:
          SOURCE_RESULT: ${{ needs.native-source-and-package.result }}
          PREVIEW_RESULT: ${{ needs.preview-pin.result }}
          BROWSER_RESULT: ${{ needs.native-browser.result }}
          ART_RESULT: ${{ needs.art.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$PREVIEW_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$ART_RESULT" = success
