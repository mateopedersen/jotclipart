name: Verified JotClipart flag package
on:
  push:
    branches: [ci/jotclipart-flag-package-2a140982a193]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXACT_REVISION: 2a140982a193e4f7553a8d2e480d3859b3125e95
      JOTCLIPART_BUILD_ROOT: work/jotclipart-release-2a140982a193
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Main-source-independent repository checkout and exact native build
        shell: bash
        run: |
          set -euo pipefail
          root="/Users/Shared/JotClipartFlagRelease/2a140982a193"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 /Users/Shared/JotClipartFlagRelease
          git clone --filter=blob:none --no-checkout https://github.com/mateopedersen/jotclipart.git "$root"
          cd "$root"
          git checkout --detach "$EXACT_REVISION"
          test "$(git rev-parse HEAD)" = "$EXACT_REVISION"
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/jotclipart-pnpm"
          node scripts/jotclipart/ci-native.mjs format
          node scripts/jotclipart/ci-native.mjs source
          pnpm build
          node scripts/jotclipart/ci-native.mjs package
          EXPECT_REVISION="$EXACT_REVISION" node scripts/jotclipart/verify-independent.mjs
